! Educational example, for a Cisco 3745 + NM-16ESW-style lab only.
! Not a complete running-config. No credentials or management access are configured.
hostname SW2
!
interface FastEthernet1/0
 description CLIENT_VLAN_10
 switchport mode access
 switchport access vlan 10
!
interface FastEthernet1/1
 description CLIENT_VLAN_20
 switchport mode access
 switchport access vlan 20
!
interface FastEthernet1/15
 description TRUNK_TO_SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,999
!
interface FastEthernet1/2
 description UNUSED_PARKED
 switchport mode access
 switchport access vlan 998
 shutdown
!
! Apply the unused-port policy to every other inactive interface.
! Verification: show vlan-switch brief, show interfaces trunk
