! Reproducible example addresses, not original lab credentials.
! Legacy MD5 used to demonstrate router authentication on old IOS.
! DO NOT reuse this mechanism or placeholder secret in a production network.
hostname R1
!
interface FastEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 ip ospf message-digest-key 1 md5 REPLACE_WITH_UNIQUE_LAB_SECRET_12
 no shutdown
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.12.0 0.0.0.3 area 0
 network 192.0.2.1 0.0.0.0 area 0
 area 0 authentication message-digest
 passive-interface Loopback0
!
! Verify: show ip ospf neighbor, show ip route ospf
