! Reproducible example addresses, not original lab credentials.
! Legacy MD5: demonstration only; replace each per-link secret before a lab run.
hostname R2
!
interface FastEthernet0/0
 ip address 10.0.12.2 255.255.255.252
 ip ospf message-digest-key 1 md5 REPLACE_WITH_UNIQUE_LAB_SECRET_12
 no shutdown
!
interface FastEthernet0/1
 ip address 10.0.23.1 255.255.255.252
 ip ospf message-digest-key 1 md5 REPLACE_WITH_UNIQUE_LAB_SECRET_23
 no shutdown
!
interface Loopback0
 ip address 192.0.2.2 255.255.255.255
!
router ospf 1
 router-id 2.2.2.2
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 192.0.2.2 0.0.0.0 area 0
 area 0 authentication message-digest
 passive-interface Loopback0
!
! Verify: show ip ospf neighbor, show ip route ospf
